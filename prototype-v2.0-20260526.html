<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>茄子代练 v2.0</title>
<style>
:root{--primary:#006be6;--primary-hover:#4096ff;--primary-light:#e6f4ff;--success:#57d188;--success-light:#f0f9eb;--warning:#efbd48;--warning-light:#fdf6ec;--danger:#ff3860;--danger-light:#fef0f0;--bg:#f5f5f5;--bg-container:#fff;--border:#e8e8e8;--border-light:#f0f0f0;--text:rgba(0,0,0,.88);--text-secondary:rgba(0,0,0,.45);--text-tertiary:rgba(0,0,0,.25);--font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;--font-size:14px;--font-size-sm:12px;--font-size-lg:16px;--radius:6px;--radius-sm:4px;--radius-lg:8px;--shadow-sm:0 1px 2px 0 rgba(0,0,0,.03),0 1px 6px -1px rgba(0,0,0,.02);--shadow-lg:0 6px 16px 0 rgba(0,0,0,.08),0 3px 6px -4px rgba(0,0,0,.12);--sider-bg:#141414;--sider-text:rgba(255,255,255,.65);--sider-text-active:#fff;--sider-item-hover:#1f1f1f;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font-family);background:var(--bg);display:flex;height:100vh;overflow:hidden;font-size:var(--font-size);color:var(--text);-webkit-font-smoothing:antialiased;}
.tree-sidebar{width:220px;background:var(--sider-bg);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;z-index:200;}
.tree-sidebar .logo{padding:16px 20px;font-size:16px;font-weight:600;color:#fff;display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;}
.tree-sidebar .logo .lgo{width:34px;height:34px;background:var(--primary);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.tree-menu{flex:1;padding:4px 0;overflow-y:auto;}
.tree-group{margin-bottom:0;}
.tree-parent{padding:10px 20px;display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--sider-text);font-size:13px;font-weight:500;transition:all .15s;user-select:none;}
.tree-parent:hover{color:#fff;background:rgba(255,255,255,.04);}
.tree-parent .arr{font-size:10px;margin-left:auto;transition:transform .2s;opacity:.5;}
.tree-parent.open{color:#fff;}
.tree-parent.open .arr{transform:rotate(90deg);opacity:1;}
.tree-children{overflow:hidden;max-height:0;transition:max-height .25s cubic-bezier(.4,0,.2,1);}
.tree-children.open{max-height:600px;}
.tree-item{padding:9px 20px 9px 48px;cursor:pointer;color:var(--sider-text);font-size:13px;transition:all .15s;position:relative;white-space:nowrap;}
.tree-item:hover{color:#fff;background:rgba(255,255,255,.04);}
.tree-item.active{color:#fff;background:var(--primary);}
.tree-item .dot{position:absolute;left:34px;top:50%;transform:translateY(-50%);width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.2);}
.tree-item.active .dot{background:#fff;}
.tree-sidebar .footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,.06);flex-shrink:0;}
.tree-sidebar .footer .logout{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;color:var(--sider-text);cursor:pointer;font-size:12px;border-radius:4px;transition:all .15s;}
.tree-sidebar .footer .logout:hover{color:#ff6890;background:rgba(255,56,96,.1);}
.main-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.topbar{background:var(--bg-container);padding:0 24px;height:48px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-light);flex-shrink:0;}
.topbar .breadcrumb{font-size:var(--font-size);color:var(--text-secondary);}
.topbar .breadcrumb span{color:var(--text);font-weight:500;}
.topbar .right{display:flex;align-items:center;gap:12px;font-size:var(--font-size-sm);color:var(--text-secondary);}
.content{flex:1;overflow-y:auto;padding:24px;}
.ant-card{background:var(--bg-container);border-radius:var(--radius-lg);margin-bottom:16px;}
.ant-card-head{padding:12px 24px;border-bottom:1px solid var(--border-light);font-size:var(--font-size-lg);font-weight:600;display:flex;align-items:center;justify-content:space-between;color:var(--text);min-height:48px;}
.ant-card-body{padding:24px;}
.ant-card-body.np{padding:0;}
.ant-table-wrap{overflow-x:auto;}
.ant-table{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--font-size);}
.ant-table th{padding:12px 16px;text-align:left;font-weight:600;color:var(--text);background:var(--bg);border-bottom:1px solid var(--border-light);font-size:var(--font-size);white-space:nowrap;}
.ant-table td{padding:12px 16px;border-bottom:1px solid var(--border-light);color:var(--text);}
.ant-table tbody tr:hover td{background:rgba(0,0,0,.02);}
.ant-table tbody tr.clickable{cursor:pointer;}
.ant-tag{display:inline-block;padding:0 7px;border-radius:var(--radius-sm);font-size:var(--font-size-sm);line-height:20px;border:1px solid;white-space:nowrap;}
.ant-tag-warning{background:var(--warning-light);color:#d4a014;border-color:#ffe7ba;}
.ant-tag-primary{background:var(--primary-light);color:var(--primary);border-color:#91caff;}
.ant-tag-success{background:var(--success-light);color:#3ea86a;border-color:#b7eb8f;}
.ant-tag-danger{background:var(--danger-light);color:var(--danger);border-color:#ffb5c1;}
.ant-tag-default{background:#fafafa;color:var(--text-secondary);border-color:var(--border);}
.ant-tag-purple{background:#f9f0ff;color:#722ed1;border-color:#d3adf7;}
.ant-btn{display:inline-flex;align-items:center;justify-content:center;padding:4px 15px;border-radius:var(--radius);font-size:var(--font-size);cursor:pointer;transition:all .2s;border:1px solid var(--border);background:var(--bg-container);color:var(--text);gap:4px;line-height:1.57143;font-family:inherit;white-space:nowrap;height:32px;box-shadow:0 1px 0 rgba(0,0,0,.02);}
.ant-btn:hover{color:var(--primary);border-color:var(--primary);}
.ant-btn-primary{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 1px 0 rgba(0,0,0,.04);}
.ant-btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover);color:#fff;}
.ant-btn-success{background:var(--success);color:#fff;border-color:var(--success);}
.ant-btn-success:hover{background:#6be09e;border-color:#6be09e;color:#fff;}
.ant-btn-danger{color:var(--danger);border-color:var(--danger);}
.ant-btn-danger:hover{color:#ff6890;border-color:#ff6890;}
.ant-btn-sm{padding:0 7px;font-size:var(--font-size-sm);height:24px;border-radius:var(--radius-sm);}
.ant-form-item{margin-bottom:20px;}
.ant-form-label{display:block;font-size:var(--font-size);color:var(--text);margin-bottom:8px;line-height:1.57143;}
.ant-form-label .req{color:var(--danger);margin-right:4px;}
.ant-input{width:100%;padding:4px 11px;border:1px solid var(--border);border-radius:var(--radius);font-size:var(--font-size);background:var(--bg-container);transition:all .2s;font-family:inherit;color:var(--text);line-height:1.57143;height:32px;}
.ant-input:hover{border-color:var(--primary-hover);}
.ant-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,107,230,.1);}
.ant-input::placeholder{color:var(--text-tertiary);}
select.ant-input{cursor:pointer;padding-right:30px;appearance:auto;}
textarea.ant-input{resize:vertical;min-height:64px;}
.ant-row{display:flex;gap:0;}.ant-row>*{flex:1;margin-right:16px;}.ant-row>*:last-child{margin-right:0;}
.ant-tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:1px solid var(--border-light);}
.ant-tab{padding:12px 0;margin-right:32px;cursor:pointer;font-size:var(--font-size);color:var(--text-secondary);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s;}
.ant-tab:hover{color:var(--primary);}.ant-tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:500;}
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.filter-bar .ant-input{width:150px;}
.ant-pagination{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding-top:16px;font-size:var(--font-size);color:var(--text-secondary);}
.ant-pagination .page-btn{min-width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;background:var(--bg-container);padding:0 6px;}
.ant-pagination .page-btn:hover{border-color:var(--primary);color:var(--primary);}
.ant-pagination .page-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.ant-pagination .total{margin-right:auto;}
.stat-row{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
.stat-item{flex:1;min-width:130px;background:var(--bg-container);border-radius:var(--radius-lg);padding:24px;cursor:pointer;transition:all .2s;border:1px solid var(--border-light);}
.stat-item:hover{border-color:var(--primary);box-shadow:var(--shadow-sm);}
.stat-item .label{font-size:var(--font-size);color:var(--text-secondary);margin-bottom:8px;}
.stat-item .value{font-size:30px;font-weight:600;color:var(--text);line-height:1.2;}
.stat-item .sub{font-size:var(--font-size-sm);color:var(--text-secondary);margin-top:4px;}
.upload-area{border:1px dashed var(--border);border-radius:var(--radius);padding:16px;text-align:center;cursor:pointer;color:var(--text-secondary);transition:all .2s;font-size:var(--font-size);background:rgba(0,0,0,.02);}
.upload-area:hover{border-color:var(--primary);color:var(--primary);}
.ant-alert{padding:8px 15px;border-radius:var(--radius);font-size:var(--font-size);color:var(--text-secondary);background:rgba(0,0,0,.02);margin-top:16px;line-height:1.57143;border:1px solid var(--border-light);}
.ant-toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:16px 32px;border-radius:var(--radius-lg);font-size:var(--font-size-lg);z-index:9999;display:none;animation:fadeIn .3s;color:var(--text);background:var(--bg-container);box-shadow:var(--shadow-lg);text-align:center;max-width:420px;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.login-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;}
.login-overlay .lgo{width:64px;height:64px;background:var(--primary);border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:32px;box-shadow:0 8px 24px rgba(0,107,230,.3);}
.login-overlay h1{font-size:28px;font-weight:600;color:var(--text);margin-bottom:8px;}
.login-overlay .sub{font-size:var(--font-size);color:var(--text-secondary);margin-bottom:40px;}
.login-overlay .enter{display:inline-block;padding:8px 48px;background:var(--primary);color:#fff;border-radius:var(--radius);font-size:var(--font-size);font-weight:500;cursor:pointer;transition:all .2s;height:40px;line-height:24px;}
.login-overlay .enter:hover{background:var(--primary-hover);}
.radio-group{display:flex;gap:8px;}
.radio-item{padding:4px 15px;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;font-size:var(--font-size);transition:all .2s;background:var(--bg-container);height:32px;line-height:22px;}
.radio-item:hover{border-color:var(--primary);color:var(--primary);}
.radio-item.active{color:var(--primary);border-color:var(--primary);background:var(--primary-light);}
.link{color:var(--primary);cursor:pointer;}.link:hover{color:var(--primary-hover);}
.scroll-x{overflow-x:auto;}
.sticky-col{position:sticky;left:0;z-index:2;background:var(--bg-container);}
.ant-table thead th.sticky-col{background:var(--bg);z-index:3;}
.ant-table tbody td.sticky-col{box-shadow:2px 0 4px rgba(0,0,0,.04);}
.tab-dot{display:inline-block;width:7px;height:7px;background:var(--danger);border-radius:50%;margin-right:4px;vertical-align:middle;position:relative;top:-1px;}
.filter-toggle{display:inline-flex;align-items:center;gap:4px;cursor:pointer;color:var(--primary);font-size:var(--font-size);user-select:none;}
.filter-toggle:hover{color:var(--primary-hover);}
.filter-panel{display:none;margin-bottom:16px;padding:16px;background:var(--bg-container);border-radius:var(--radius-lg);border:1px solid var(--border-light);}
.filter-panel.show{display:block;}
.breadcrumb .sep{color:var(--text-tertiary);margin:0 6px;}
.floating-ball{position:fixed;bottom:40px;right:24px;width:50px;height:50px;background:var(--primary);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:9998;box-shadow:0 4px 16px rgba(0,107,230,.4);transition:all .2s;font-size:20px;}
.floating-ball:hover{transform:scale(1.1);box-shadow:0 6px 24px rgba(0,107,230,.5);}
.role-panel{position:fixed;bottom:100px;right:24px;width:280px;background:var(--bg-container);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);z-index:9997;display:none;overflow:hidden;}
.role-panel.show{display:block;animation:fadeIn .2s;}
.role-panel .rp-header{padding:16px 20px;border-bottom:1px solid var(--border-light);font-weight:600;font-size:var(--font-size-lg);}
.role-panel .rp-body{max-height:320px;overflow-y:auto;}
.role-panel .rp-item{padding:12px 20px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .15s;border-bottom:1px solid var(--border-light);}
.role-panel .rp-item:hover{background:var(--primary-light);}
.role-panel .rp-item.active{background:var(--primary-light);border-left:3px solid var(--primary);}
.role-panel .rp-item .rp-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.role-panel .rp-item .rp-icon.op{background:#e6f4ff;color:var(--primary);}
.role-panel .rp-item .rp-icon.cs{background:#f0f9eb;color:var(--success);}
.role-panel .rp-item .rp-icon.fin{background:#fdf6ec;color:var(--warning);}
.role-panel .rp-item .rp-icon.guild{background:#f9f0ff;color:#722ed1;}
.role-panel .rp-item .rp-icon.booster{background:#e6f4ff;color:var(--primary);}
.role-panel .rp-item .rp-info{flex:1;min-width:0;}
.role-panel .rp-item .rp-name{font-size:var(--font-size);font-weight:500;color:var(--text);}
.role-panel .rp-item .rp-desc{font-size:var(--font-size-sm);color:var(--text-secondary);}
.role-panel .rp-item .rp-check{color:var(--primary);font-size:16px;}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:9998;display:none;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal-box{background:var(--bg-container);border-radius:var(--radius-lg);width:520px;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:fadeIn .2s;}
.modal-box .modal-header{padding:16px 24px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;font-size:var(--font-size-lg);font-weight:600;}
.modal-box .modal-header .close{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);cursor:pointer;font-size:16px;color:var(--text-secondary);transition:all .15s;}
.modal-box .modal-header .close:hover{background:var(--bg);color:var(--text);}
.modal-box .modal-body{padding:24px;}
.modal-box .modal-footer{padding:12px 24px;border-top:1px solid var(--border-light);display:flex;justify-content:flex-end;gap:8px;}
.role-badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:500;}
.role-badge.op{background:#e6f4ff;color:var(--primary);}
.role-badge.cs{background:#f0f9eb;color:var(--success);}
.role-badge.fin{background:#fdf6ec;color:#d4a014;}
.role-badge.guild{background:#f9f0ff;color:#722ed1;}
.role-badge.booster{background:#e6f4ff;color:var(--primary);}
.role-badge.admin{background:#fef0f0;color:var(--danger);}
</style>
</head>
<body>
<div class="login-overlay" id="login-overlay">
  <div class="lgo">🍆</div>
  <h1>茄子代练</h1>
  <div class="sub">工作室SAAS管理平台</div>
  <div class="enter" onclick="doLogin()">进入系统</div>
</div>
<div class="tree-sidebar" id="sidebar">
  <div class="logo"><div class="lgo">🍆</div>茄子代练</div>
  <div class="tree-menu" id="tree-menu"></div>
  <div class="footer"><div class="logout" onclick="doLogout()">🚪 退出登录</div></div>
</div>
<div class="main-wrap">
  <div class="topbar">
    <div class="breadcrumb" id="breadcrumb">工作台 / <span>首页</span></div>
    <div class="right">2026-05-26 &nbsp;|&nbsp; <span id="top-role" class="role-badge op">平台运营</span></div>
  </div>
  <div class="content" id="content-area"></div>
</div>
<div class="ant-toast" id="toast"></div>
<div class="floating-ball" id="floating-ball" onclick="toggleRolePanel()" title="切换角色">🔄</div>
<div class="role-panel" id="role-panel">
  <div class="rp-header">切换角色视角</div>
  <div class="rp-body" id="role-list"></div>
</div>
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box" id="modal-box"></div>
</div>
<script>

var curPage='home',openGroup='workspace',curTab='全部',curSubTab='按日统计',toastTimer,currentRole='operator',grabCounter=0;

var roleDefs=[
  {key:'admin',name:'平台管理员',icon:'👑',css:'admin',desc:'系统最高权限，处理特殊事件'},
  {key:'operator',name:'平台运营',icon:'⚙️',css:'op',desc:'订单录入、代练管理、工会管理、系统配置'},
  {key:'cs',name:'平台客服',icon:'🎧',css:'cs',desc:'订单审核、验收、结算'},
  {key:'finance',name:'平台财务',icon:'💰',css:'fin',desc:'提现审核、工会/代练/客服结算'},
  {key:'guild_admin',name:'工会管理员',icon:'🏛️',css:'guild',desc:'工会最高权限，管理本工会代练'},
  {key:'guild_operator',name:'工会运营',icon:'🏢',css:'guild',desc:'订单录入，管理本工会人员和订单'},
  {key:'booster',name:'代练',icon:'🎮',css:'booster',desc:'接单、执行、交付、提现'}
];

function getRole(){return roleDefs.find(function(r){return r.key===currentRole;})||roleDefs[0];}

function roleVisible(pageId){
  var r=currentRole;
  // 我的资产：仅工会和打手
  if(pageId==='my-assets') return r==='guild_admin'||r==='guild_operator'||r==='booster';
  // 订单录入：打手和客服不可见
  if(pageId==='order-entry') return r!=='booster'&&r!=='cs';
  // 财务管理：打手不可见
  if(pageId==='guild-settlement'||pageId==='booster-settlement'||pageId==='cs-settlement'||pageId==='withdraw-audit') return r!=='booster';
  // 人员管理和系统管理：客服和打手不可见
  if(pageId==='org-mgmt'||pageId==='position-mgmt'||pageId==='user-mgmt'||pageId==='booster-review'||pageId==='bind-set'||pageId==='game-config'||pageId==='permission-mgmt') return r!=='booster'&&r!=='cs';
  // 订单池：客服和财务不可见
  if(pageId==='order-pool') return r!=='cs'&&r!=='finance';
  return true;
}

function roleHasGroup(groupKey){
  var items=menuTree.find(function(g){return g.key===groupKey;});
  if(!items) return false;
  return items.children.some(function(c){return roleVisible(c.id);});
}

var menuTree=[
  {key:'workspace',icon:'📊',label:'工作台',children:[
    {id:'home',label:'首页',icon:'🏠'},
    {id:'my-assets',label:'我的资产',icon:'💎'}
  ]},
  {key:'order',icon:'📋',label:'订单管理',badge:'28',children:[
    {id:'order-entry',label:'订单录入',icon:'➕'},
    {id:'order-mgmt',label:'订单管理',icon:'📋'},
    {id:'order-pool',label:'订单池',icon:'📦',badge:'8'}
  ]},
  {key:'data',icon:'📈',label:'数据报表',children:[
    {id:'data-overview',label:'数据概览',icon:'📊'}
  ]},
  {key:'finance',icon:'💰',label:'财务管理',badge:'6',children:[
    {id:'guild-settlement',label:'工会结算',icon:'🏛️'},
    {id:'booster-settlement',label:'打手结算',icon:'💵'},
    {id:'cs-settlement',label:'客服结算',icon:'💳'},
    {id:'withdraw-audit',label:'提现审核',icon:'🔐',badge:'3'}
  ]},
  {key:'personnel',icon:'👥',label:'人员管理',children:[
    {id:'org-mgmt',label:'机构管理',icon:'🏢'},
    {id:'position-mgmt',label:'岗位管理',icon:'📝'},
    {id:'user-mgmt',label:'用户管理',icon:'👤'},
    {id:'booster-review',label:'打手审核',icon:'✅',badge:'2'},
    {id:'bind-set',label:'下家绑定',icon:'🔗'}
  ]},
  {key:'system',icon:'⚙️',label:'系统管理',children:[
    {id:'game-config',label:'游戏设置',icon:'🎮'},
    {id:'permission-mgmt',label:'权限管理',icon:'🔐'}
  ]}

function renderTree(){
  var h='',role=getRole();
  menuTree.forEach(function(g){
    // Filter visible children
    var visChildren=g.children.filter(function(c){return roleVisible(c.id);});
    if(visChildren.length===0) return;
    var open=openGroup===g.key;
    h+='<div class="tree-group">';
    h+='<div class="tree-parent'+(open?' open':'')+'" data-key="'+g.key+'">'+g.icon+' '+g.label;
    if(g.badge) h+=' <span style="background:var(--danger);color:#fff;padding:0 5px;border-radius:8px;font-size:10px;margin-left:4px;">'+g.badge+'</span>';
    h+='<span class="arr">▶</span></div>';
    h+='<div class="tree-children'+(open?' open':'')+'">';
    visChildren.forEach(function(c){
      h+='<div class="tree-item'+(curPage===c.id?' active':'')+'" data-page="'+c.id+'"><span class="dot"></span>'+c.label;
      if(c.badge) h+=' <span style="background:var(--danger);color:#fff;padding:0 5px;border-radius:8px;font-size:10px;margin-left:4px;">'+c.badge+'</span>';
      h+='</div>';
    });
    h+='</div></div>';
  });
  document.getElementById('tree-menu').innerHTML=h;
  document.getElementById('top-role').textContent=role.name;
  document.getElementById('top-role').className='role-badge '+role.css;
  document.querySelectorAll('.tree-parent').forEach(function(el){
    el.addEventListener('click',function(e){
      e.stopPropagation();
      var k=this.getAttribute('data-key');
      toggleGroup(k);
    });
  });
  document.querySelectorAll('.tree-item').forEach(function(el){
    el.addEventListener('click',function(e){
      e.stopPropagation();
      var p=this.getAttribute('data-page');
      if(p===curPage) return;
      curPage=p;
      openGroup=findGroup(p);
      renderTree();
      renderContent();
    });
  });
}

function findGroup(pageId){
  for(var i=0;i<menuTree.length;i++){
    var g=menuTree[i];
    for(var j=0;j<g.children.length;j++){
      if(g.children[j].id===pageId) return g.key;
    }
  }
  return openGroup;
}

function toggleGroup(key){
  openGroup=openGroup===key?'':key;
  renderTree();
}

function renderRolePanel(){
  var h='';
  roleDefs.forEach(function(r){
    h+='<div class="rp-item'+(r.key===currentRole?' active':'')+'" onclick="switchRole(\''+r.key+'\')"><div class="rp-icon '+r.css+'">'+r.icon+'</div><div class="rp-info"><div class="rp-name">'+r.name+'</div><div class="rp-desc">'+r.desc+'</div></div>'+(r.key===currentRole?'<span class="rp-check">✓</span>':'')+'</div>';
  });
  document.getElementById('role-list').innerHTML=h;
}

function toggleRolePanel(){
  var p=document.getElementById('role-panel');
  if(p.classList.contains('show')){p.classList.remove('show');return;}
  renderRolePanel();
  p.classList.add('show');
}

function switchRole(key){
  currentRole=key;
  // Auto-navigate to valid page if current is hidden
  if(!roleVisible(curPage)) curPage='home';
  openGroup='workspace';
  curTab='全部';
  document.getElementById('role-panel').classList.remove('show');
  renderTree();
  renderContent();
}

function setBreadcrumb(title){
  var parts=title.split(' > ');
  var h='';
  parts.forEach(function(p,i){
    if(i>0) h+='<span class="sep">/</span>';
    if(i===parts.length-1) h+='<span>'+p+'</span>';
    else h+=p;
  });
  document.getElementById('breadcrumb').innerHTML=h;
}

function toast(msg,red){
  var t=document.getElementById('toast');
  if(red) msg=msg.replace(red,'<span style="color:var(--danger);font-weight:600;">'+red+'</span>');
  t.innerHTML=msg;t.style.display='block';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.style.display='none';},5000);
}
