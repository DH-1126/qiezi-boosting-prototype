function renderSidebar() {
  var cfg = roleConfig[currentRole];
  var html = '<div class="logo"><span class="dot"></span>茄子代练<small>·后台</small></div>';
  cfg.nav.forEach(function(section) {
    html += '<div class="nav-section"><div class="nav-group-title">'+section.section+'</div>';
    section.items.forEach(function(item) {
      var bh = '';
      if (item.badge) { var bc = item.badgeWarn ? 'warn' : ''; bh = ' <span class="badge '+bc+'">'+item.badge+'</span>'; }
      var isActive = currentPage === (item.pageOverride || item.id) && (!item.tab || item.tab === currentTab);
      var tabAttr = item.tab ? ' data-tab="'+item.tab+'"' : '';
      html += '<a class="nav-link'+(isActive?' active':'')+'" data-page="'+(item.pageOverride || item.id)+'"'+tabAttr+'>'+item.icon+' '+item.label+bh+'</a>';
    });
    html += '</div>';
  });
  html += '<div class="user-info">'+cfg.name+'</div>';
  document.getElementById('sidebar').innerHTML = html;
  document.querySelectorAll('.nav-link').forEach(function(lk) {
    lk.addEventListener('click', function(e) {
      e.preventDefault();
      navigate(this.getAttribute('data-page'), this.getAttribute('data-tab') || '全部');
    });
  });
}

function navigate(page, tab) {
  currentPage = page;
  if (tab) currentTab = tab;
  if (page === 'order-list-cs' || page === 'order-list-guild') currentPage = 'order-list';
  renderSidebar();
  renderContent();
}

function getPageTitle() {
  if (currentPage === 'order-list') return '📋 订单列表 · ' + currentTab;
  var all = roleConfig[currentRole].nav;
  for (var i=0; i<all.length; i++)
    for (var j=0; j<all[i].items.length; j++)
      if (all[i].items[j].id === currentPage || all[i].items[j].pageOverride === currentPage)
        return all[i].items[j].icon+' '+all[i].items[j].label;
  return currentPage;
}

function renderContent() {
  document.getElementById('page-title').textContent = getPageTitle();
  var c = document.getElementById('content-area'); c.innerHTML = '';

function renderOrderList(role, activeTab) {
  if (!activeTab) activeTab = '全部';
  var isGuild = role === 'guild';
  var showActions = (role === 'cs' || role === 'ops' || isGuild);
  var isCS = role === 'cs';
  var isOps = role === 'ops';
  var actionHeader = showActions ? '<th>操作</th>' : '';
  var allTabs = ['全部','待审核','待接单','执行中','待验收','待结算','已完成'];

  // 统计
  var counts = {}; allTabs.forEach(function(t){ counts[t]=0; });
  orderDataset.forEach(function(o){ counts[o.status]++; counts['全部']++; });
  var filtered = activeTab === '全部' ? orderDataset.slice() : orderDataset.filter(function(o){ return o.status === activeTab; });
  // 工会管理员只看本工会订单
  if (isGuild) filtered = filtered.filter(function(o){ return o.guild === '三角洲工会A组'; });

  var tabsHtml = allTabs.map(function(t) {
    var cls = t === activeTab ? ' class="tab active"' : ' class="tab"';
    return '<a'+cls+' data-tab="'+t+'" onclick="navigateOrderTab(\''+t+'\')">'+t+'<span class="cnt">'+counts[t]+'</span></a>';
  }).join('');

  function actionCell(status) {
    if (!showActions) return '';
    // 运营和工会管理员只能查看
    if (!isCS) return '<a class="btn btn-xs" onclick="showToast(event,\'📋 查看订单详情\',\'#1890ff\')">查看</a>';
    // 客服根据状态显示对应操作
    switch(status) {
      case '待审核': return '<a class="btn btn-xs btn-p" onclick="showToast(event,\'🔍 进入审核\',\'#1890ff\')">审核</a> <a class="btn btn-xs btn-d" onclick="showToast(event,\'订单已关闭\',\'#999\')">关单</a>';

      default: return '<a class="btn btn-xs" onclick="showToast(event,\'📋 查看订单详情\',\'#1890ff\')">查看</a>';
    }

  var rowsHtml = filtered.map(function(o) {

  return `

function showToast(e, msg, color) {
  if (e) e.stopPropagation();
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.background = color || '#52c41a'; t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 2000);
}

function bindInteractions() {
  document.querySelectorAll('.opt-group').forEach(function(g) {
    g.querySelectorAll('.opt-item').forEach(function(item) {
      item.addEventListener('click', function() {
        g.querySelectorAll('.opt-item').forEach(function(i) { i.classList.remove('sel'); });
        this.classList.add('sel');
        var v = this.getAttribute('data-val');
        if (g.id === 'entry-type') { var a = document.getElementById('entry-assign'); if (a) a.style.display = v==='派单' ? '' : 'none'; }
        if (g.id === 'entry-source') { var p = document.getElementById('entry-pay'); if (p) p.value = v==='私域' ? '预付（客户已付）' : '后付（完成后收款）'; }
        if (g.id === 'withdraw-method') { ['wechat','alipay','bank'].forEach(function(k) { var e = document.getElementById('wd-'+k); if (e) e.style.display = 'none'; }); var t = document.getElementById('wd-'+v); if (t) t.style.display = ''; }
      });
    });
  });
}

function switchRole(role) {
  currentRole = role; currentTab = '全部';
  updateRoleUI();
  currentPage = role==='ops'?'dashboard':role==='cs'?'cs-dashboard':role==='guild'?'guild-dashboard':role==='booster'?'booster-dashboard':'finance-dashboard';
  renderSidebar(); renderContent();
}

function updateRoleUI() {
  var cfg = roleConfig[currentRole];
  var dd = document.getElementById('role-dropdown');
  dd.innerHTML = '<span class="rdot '+cfg.cssClass+'"></span> '+cfg.name+' <span class="arrow">▾</span>';
  document.querySelectorAll('.role-menu-item').forEach(function(item) {
    item.classList.remove('active');
    if (item.getAttribute('data-role') === currentRole) item.classList.add('active');
  });
  document.getElementById('role-menu').classList.remove('show');
}

document.getElementById('role-dropdown').addEventListener('click', function(e) {
  e.stopPropagation();
  document.getElementById('role-menu').classList.toggle('show');
});
document.querySelectorAll('.role-menu-item').forEach(function(item) {
  item.addEventListener('click', function(e) { e.stopPropagation(); switchRole(this.getAttribute('data-role')); });
});
document.addEventListener('click', function() {
  document.getElementById('role-menu').classList.remove('show');
});

function doLogin() {
  document.getElementById('login-overlay').style.display = 'none';
}
function doLogout() {
  document.getElementById('login-overlay').style.display = 'flex';
}

renderSidebar();
renderContent();
updateRoleUI();
