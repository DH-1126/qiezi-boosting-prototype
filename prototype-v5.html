<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>茄子代练 v5 — 基于竞品优化</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f0f2f5;display:flex;height:100vh;overflow:hidden;}

/* 深色侧边栏 — v3 风格 */
.sidebar{width:220px;background:#001529;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;height:100vh;}
.sidebar .logo{padding:16px;font-size:15px;font-weight:bold;color:#fff;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:8px;}
.sidebar .logo .dot{width:8px;height:8px;background:#52c41a;border-radius:50%;}
.sidebar .logo small{font-size:10px;color:rgba(255,255,255,0.35);font-weight:400;margin-left:4px;}
.nav-section{padding:8px 0;}
.nav-group-title{padding:8px 20px 4px;font-size:10px;color:rgba(255,255,255,0.25);text-transform:uppercase;letter-spacing:1.5px;}
.nav-link{padding:10px 20px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(255,255,255,0.55);transition:all .15s;border-left:3px solid transparent;}
.nav-link:hover{color:#fff;background:rgba(255,255,255,0.04);}
.nav-link.active{color:#fff;background:rgba(255,255,255,0.08);border-left-color:#1890ff;}
.nav-link .badge{background:#f5222d;color:#fff;padding:1px 6px;border-radius:10px;font-size:10px;margin-left:auto;}
.nav-link .badge.warn{background:#fa8c16;}
.sidebar .user-info{margin-top:auto;padding:14px 16px;border-top:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(255,255,255,0.45);}

/* 主区域 */
.main-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{background:#fff;padding:0 20px;height:48px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f0f0f0;font-size:13px;flex-shrink:0;}
.topbar .title{font-weight:500;display:flex;align-items:center;gap:8px;}
.content{flex:1;overflow-y:auto;padding:20px;}

/* 角色切换 */
.role-switcher{position:relative;}
.role-dropdown{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:6px;cursor:pointer;border:1px solid #e8e8e8;font-size:13px;transition:all .2s;user-select:none;background:#fafafa;}
.role-dropdown:hover{border-color:#1890ff;}
.role-dropdown .arrow{font-size:10px;color:#999;}
.role-dropdown .rdot{width:7px;height:7px;border-radius:50%;display:inline-block;}
.role-dropdown .rdot.ops{background:#1890ff;}
.role-dropdown .rdot.cs{background:#fa8c16;}
.role-dropdown .rdot.finance{background:#eb2f96;}
.role-menu{position:absolute;top:100%;right:0;margin-top:4px;background:#fff;border:1px solid #e8e8e8;border-radius:8px;padding:4px;min-width:200px;display:none;z-index:400;box-shadow:0 8px 24px rgba(0,0,0,.1);}
.role-menu.show{display:block;}
.role-menu-item{padding:10px 14px;cursor:pointer;border-radius:6px;font-size:13px;color:#333;display:flex;align-items:center;gap:10px;transition:all .15s;}
.role-menu-item:hover{background:#f5f5f5;}
.role-menu-item.active{background:#e6f7ff;color:#1890ff;}
.role-menu-item .check{margin-left:auto;font-size:11px;visibility:hidden;}
.role-menu-item.active .check{visibility:visible;}
.role-menu-item .rdot{width:7px;height:7px;border-radius:50%;display:inline-block;}
.role-menu-item .rdot.ops{background:#1890ff;}
.role-menu-item .rdot.cs{background:#fa8c16;}
.role-menu-item .rdot.finance{background:#eb2f96;}

.stat-cards{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.stat-card{flex:1;min-width:130px;background:#fff;border-radius:8px;padding:18px;cursor:pointer;transition:all .2s;border:1px solid transparent;}
.stat-card:hover{border-color:#1890ff;box-shadow:0 2px 8px rgba(24,144,255,0.1);}
.stat-card .l{font-size:12px;color:#999;margin-bottom:8px;}
.stat-card .v{font-size:28px;font-weight:600;color:#262626;}
.stat-card .s{font-size:11px;margin-top:4px;}
.panel{background:#fff;border-radius:8px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.04);}
.panel-hd{padding:14px 18px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:500;}
.panel-bd{padding:16px 18px;}
.panel-bd.nopad{padding:0;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:#fafafa;padding:9px 10px;text-align:left;font-weight:500;color:#888;border-bottom:1px solid #f0f0f0;font-size:12px;white-space:nowrap;}
td{padding:9px 10px;border-bottom:1px solid #f5f5f5;}
tr.clickable{cursor:pointer;}tr.clickable:hover{background:#e6f7ff;}

.tag{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;}
.tag-o{background:#fff7e6;color:#fa8c16;}.tag-b{background:#e6f7ff;color:#1890ff;}.tag-g{background:#f6ffed;color:#52c41a;}
.tag-r{background:#fff1f0;color:#f5222d;}.tag-p{background:#f9f0ff;color:#722ed1;}.tag-pink{background:#fff0f6;color:#eb2f96;}
.tag-gray{background:#f5f5f5;color:#999;}

.btn{display:inline-block;padding:7px 14px;border-radius:4px;border:1px solid #d9d9d9;background:#fff;color:#333;cursor:pointer;font-size:12px;transition:all .2s;}
.btn:hover{border-color:#1890ff;color:#1890ff;}
.btn-p{background:#1890ff;color:#fff;border-color:#1890ff;}.btn-p:hover{background:#40a9ff;color:#fff;}
.btn-s{background:#52c41a;color:#fff;border-color:#52c41a;}.btn-d{color:#f5222d;border-color:#f5222d;}.btn-d:hover{background:#fff1f0;}
.btn-w{color:#fa8c16;border-color:#fa8c16;}.btn-sm{padding:4px 10px;font-size:11px;}.btn-xs{padding:3px 8px;font-size:11px;}
.btn-group{display:flex;gap:6px;}

.form-group{margin-bottom:14px;}.form-label{display:block;font-size:12px;color:#333;margin-bottom:4px;font-weight:500;}.form-label .req{color:#f5222d;}
.form-input{width:100%;padding:7px 10px;border:1px solid #d9d9d9;border-radius:4px;font-size:13px;background:#fff;}
.form-input:focus{outline:none;border-color:#1890ff;box-shadow:0 0 0 2px rgba(24,144,255,0.15);}select.form-input{cursor:pointer;}
textarea.form-input{resize:vertical;min-height:70px;font-family:inherit;}.form-row{display:flex;gap:14px;}.form-row>*{flex:1;}
.opt-group{display:flex;gap:6px;flex-wrap:wrap;}
.opt-item{padding:6px 14px;border:1px solid #d9d9d9;border-radius:4px;cursor:pointer;font-size:12px;transition:all .2s;background:#fff;}
.opt-item:hover{border-color:#1890ff;}.opt-item.sel{background:#e6f7ff;color:#1890ff;border-color:#1890ff;}
.tabs{display:flex;gap:0;margin-bottom:14px;border-bottom:2px solid #f0f0f0;flex-wrap:wrap;}
.tab{padding:8px 14px;cursor:pointer;font-size:12px;color:#888;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;}
.tab:hover{color:#1890ff;}.tab.active{color:#1890ff;border-bottom-color:#1890ff;font-weight:500;}.tab .cnt{font-size:11px;}
.tip{background:#fffbe6;border:1px solid #ffe58f;border-radius:8px;padding:12px 16px;font-size:12px;color:#666;margin-top:12px;}.tip strong{color:#fa8c16;}
.link{color:#1890ff;cursor:pointer;}.link:hover{color:#40a9ff;text-decoration:underline;}
.toast{position:fixed;top:60px;right:20px;padding:10px 18px;border-radius:4px;font-size:13px;z-index:9999;display:none;animation:fadeIn .3s;color:#fff;}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
.mt12{margin-top:12px;}.mb12{margin-bottom:12px;}

/* 登录页 */
.login-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#141414,#1a1a2e 50%,#16213e);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;}
.login-overlay .login-box{text-align:center;}
.login-overlay .login-logo{width:64px;height:64px;background:#52c41a;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:32px;box-shadow:0 8px 32px rgba(82,196,26,0.3);}
.login-overlay h1{font-size:32px;font-weight:bold;color:#fff;margin-bottom:8px;}
.login-overlay .sub{font-size:14px;color:rgba(255,255,255,0.45);margin-bottom:48px;}
.login-overlay .enter-btn{display:inline-block;padding:12px 64px;background:#fff;color:#141414;border-radius:8px;font-size:16px;font-weight:500;cursor:pointer;transition:all .2s;}
.login-overlay .enter-btn:hover{transform:scale(1.02);}
.login-overlay .hint{margin-top:16px;font-size:12px;color:rgba(255,255,255,0.25);}
</style>
</head>
<body>

<!-- 登录页 -->
<div class="login-overlay" id="login-overlay">
  <div class="login-box">
    <div class="login-logo">🍆</div>

<!-- 侧边栏 -->
<aside class="sidebar" id="sidebar"></aside>

<!-- 主区域 -->
<div class="main-wrap">
  <div class="topbar">
    <span class="title" id="page-title">📊 工作台</span>
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="role-switcher" id="role-switcher">
        <div class="role-dropdown" id="role-dropdown" onclick="toggleRoleMenu()">
          <span class="rdot ops"></span> 平台运营 <span class="arrow">▾</span>

      </div>

      <span style="color:#999;font-size:12px;">2026-05-20</span>

<script>
var currentRole='ops',currentPage='dashboard',currentTab='全部';

var roleNames={ops:'平台运营',cs:'平台客服',finance:'平台财务'};
var roleDots={ops:'ops',cs:'cs',finance:'finance'};

var fullMenu=[
  { section:'工作台', items:[
    {id:'dashboard', icon:'📊', label:'数据概览'},
  ]},
  { section:'订单管理', items:[
    {id:'order-entry', icon:'➕', label:'录入订单'},
    {id:'order-list', icon:'📋', label:'订单列表', badge:'36'},
    {id:'order-pool', icon:'🌐', label:'外部订单池', badge:'15'},
    {id:'order-alert', icon:'🚨', label:'告警单', badge:'2', badgeWarn:true},
  ]},
  { section:'运营中心', items:[
    {id:'booster-mgmt', icon:'👥', label:'代练员管理'},
    {id:'booster-approval', icon:'🔍', label:'代练身份审核', badge:'3', badgeWarn:true},
    {id:'guild-mgmt', icon:'🏛️', label:'工会管理'},
  ]},
  { section:'财务管理', items:[
    {id:'finance-dashboard', icon:'📊', label:'结算概览'},
    {id:'booster-settlement', icon:'💳', label:'代练结算'},
    {id:'cs-settlement', icon:'💼', label:'客服结算'},
    {id:'guild-settlement', icon:'🏛️', label:'工会结算'},
    {id:'withdraw-audit', icon:'💵', label:'提现审核', badge:'5', badgeWarn:true},
  ]},
  { section:'系统设置', items:[
    {id:'game-config', icon:'🎮', label:'游戏配置'},
    {id:'role-mgmt', icon:'🔐', label:'角色管理'},
    {id:'position-mgmt', icon:'📌', label:'岗位管理'},
    {id:'org-mgmt', icon:'🏢', label:'机构管理'},
  ]},
  { section:'数据报表', items:[
    {id:'order-report', icon:'📈', label:'订单报表'},
  ]},
];

function renderSidebar(){
  var h='<div class="logo"><span class="dot"></span>茄子代练<small>·后台</small></div>';
  fullMenu.forEach(function(section){
    h+='<div class="nav-section"><div class="nav-group-title">'+section.section+'</div>';
    section.items.forEach(function(item){
      var bh='';if(item.badge){var bc=item.badgeWarn?'warn':'';bh=' <span class="badge '+bc+'">'+item.badge+'</span>';}
      h+='<a class="nav-link'+(currentPage===item.id?' active':'')+'" data-page="'+item.id+'">'+item.icon+' '+item.label+bh+'</a>';
    });
    h+='</div>';
  });
  h+='<div class="user-info">👤 '+roleNames[currentRole]+'</div>';
  document.getElementById('sidebar').innerHTML=h;
  document.querySelectorAll('.nav-link').forEach(function(lk){
    lk.addEventListener('click',function(e){
      e.preventDefault();
      currentPage=this.getAttribute('data-page');
      renderSidebar();
      renderContent();
    });
  });
}

function goPage(p){currentPage=p;currentTab='全部';renderSidebar();renderContent();}


function renderContent(){
  var titleMap={dashboard:'📊 工作台','order-list':'📋 订单列表','order-entry':'➕ 录入订单','order-pool':'🌐 外部订单池','order-alert':'🚨 告警单','booster-mgmt':'👥 代练员管理','booster-approval':'🔍 代练身份审核','guild-mgmt':'🏛️ 工会管理','finance-dashboard':'💰 结算概览','booster-settlement':'💳 代练结算','cs-settlement':'💼 客服结算','guild-settlement':'🏛️ 工会结算','withdraw-audit':'💵 提现审核','game-config':'🎮 游戏配置','role-mgmt':'🔐 角色管理','position-mgmt':'📌 岗位管理','org-mgmt':'🏢 机构管理','order-report':'📈 订单报表',data:'📊 数据报表'};
  document.getElementById('page-title').textContent=titleMap[currentPage]||currentPage;
  var c=document.getElementById('content-area');c.innerHTML='';
  var v=document.createElement('div');

  switch(currentPage){
    case 'dashboard':v.innerHTML=renderDashboard();break;
    case 'order-list':v.innerHTML=renderOrderList();break;
    case 'order-entry':v.innerHTML=renderOrderEntry();break;
    case 'order-pool':v.innerHTML=renderOrderPool();break;
    case 'order-alert':v.innerHTML=renderOrderAlert();break;
    case 'booster-mgmt':v.innerHTML=renderBoosterMgmt();break;
    case 'booster-approval':v.innerHTML=renderBoosterApproval();break;
    case 'guild-mgmt':v.innerHTML=renderGuildMgmt();break;
    case 'finance-dashboard':v.innerHTML=renderFinanceDashboard();break;
    case 'booster-settlement':v.innerHTML=renderBoosterSettlement();break;
    case 'cs-settlement':v.innerHTML=renderCSSettlement();break;
    case 'guild-settlement':v.innerHTML=renderGuildSettlement();break;
    case 'withdraw-audit':v.innerHTML=renderWithdrawAudit();break;
    case 'game-config':v.innerHTML=renderGameConfig();break;
    case 'role-mgmt':v.innerHTML=renderRoleMgmt();break;
    case 'position-mgmt':v.innerHTML=renderPositionMgmt();break;
    case 'org-mgmt':v.innerHTML=renderOrgMgmt();break;
    case 'order-report':v.innerHTML=renderOrderReport();break;
    default:v.innerHTML='<div class="panel"><div class="panel-bd" style="text-align:center;padding:80px;color:#999;">功能开发中</div></div>';
  }
  c.appendChild(v);
  bindInteractions();
}

// ==================== 工作台 ====================

  return `

// ==================== 工具函数 ====================
function toast(e,msg){if(e)e.stopPropagation();var t=document.getElementById('toast');t.textContent=msg;t.style.background='#52c41a';t.style.display='block';setTimeout(function(){t.style.display='none';},2000);}
function bindInteractions(){
  document.querySelectorAll('.opt-group').forEach(function(g){
    g.querySelectorAll('.opt-item').forEach(function(i){
      i.addEventListener('click',function(){g.querySelectorAll('.opt-item').forEach(function(x){x.classList.remove('sel');});this.classList.add('sel');});
    });
  });
}
function toggleRoleMenu(){document.getElementById('role-menu').classList.toggle('show');}
function switchRole(role){
  currentRole=role;currentTab='全部';
  document.querySelectorAll('.role-menu-item').forEach(function(i){i.classList.remove('active');if(i.getAttribute('data-role')===role)i.classList.add('active');});
  var dd=document.getElementById('role-dropdown');
  dd.innerHTML='<span class="rdot '+roleDots[role]+'"></span> '+roleNames[role]+' <span class="arrow">▾</span>';
  document.getElementById('role-menu').classList.remove('show');
  currentPage='dashboard';renderSidebar();renderContent();
}
document.querySelectorAll('.role-menu-item').forEach(function(i){i.addEventListener('click',function(e){e.stopPropagation();switchRole(this.getAttribute('data-role'));});});
document.addEventListener('click',function(){document.getElementById('role-menu').classList.remove('show');});

function doLogin(){document.getElementById('login-overlay').style.display='none';}
function doLogout(){document.getElementById('login-overlay').style.display='flex';}

renderSidebar();
renderContent();
</script>
