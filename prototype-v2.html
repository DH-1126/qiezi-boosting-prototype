<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代练管理平台 — 全角色原型</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#f0f2f5; }

  /* ===== 角色切换栏 ===== */
  .role-bar { background:#141414; color:#fff; padding:0 16px; height:44px; display:flex; align-items:center; justify-content:space-between; font-size:13px; position:sticky; top:0; z-index:300; }
  .role-bar .brand { font-weight:bold; font-size:14px; display:flex; align-items:center; gap:6px; }
  .role-bar .brand .dot { width:6px;height:6px;background:#52c41a;border-radius:50%; }
  .role-switcher { display:flex; gap:4px; }
  .role-btn { padding:6px 16px; border-radius:4px; cursor:pointer; border:1px solid transparent; background:transparent; color:rgba(255,255,255,0.6); font-size:12px; transition:all .2s; }
  .role-btn:hover { color:#fff; background:rgba(255,255,255,0.08); }
  .role-btn.active { color:#fff; background:rgba(255,255,255,0.15); border-color:rgba(255,255,255,0.25); }
  .role-btn.ops.active { background:#1890ff; border-color:#1890ff; color:#fff; }
  .role-btn.cs.active { background:#fa8c16; border-color:#fa8c16; color:#fff; }
  .role-btn.booster.active { background:#52c41a; border-color:#52c41a; color:#fff; }
  .current-role { font-size:11px; padding:4px 10px; border-radius:10px; margin-left:8px; }
  .current-role.ops { background:#1890ff; }
  .current-role.cs { background:#fa8c16; }
  .current-role.booster { background:#52c41a; }

  /* ===== 布局 ===== */
  .layout { display:flex; min-height:calc(100vh - 44px); }
  .sidebar { width:200px; background:#fff; border-right:1px solid #f0f0f0; display:flex; flex-direction:column; position:sticky; top:44px; height:calc(100vh - 44px); }
  .sidebar .user-info { padding:16px; border-bottom:1px solid #f0f0f0; display:flex; align-items:center; gap:10px; }
  .sidebar .user-info .avatar { width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px; }
  .sidebar .user-info .name { font-size:14px; font-weight:500; }
  .sidebar .user-info .role-tag { font-size:11px; color:#999; }
  .nav-section { padding:4px 0; }
  .nav-label { padding:8px 16px 2px; font-size:10px; color:#bbb; text-transform:uppercase; letter-spacing:1px; }
  .nav-link { padding:9px 16px; cursor:pointer; display:flex; align-items:center; gap:8px; font-size:13px; color:#555; transition:all .15s; border-left:3px solid transparent; }
  .nav-link:hover { color:#1890ff; background:#fafafa; }
  .nav-link.active { color:#1890ff; background:#e6f7ff; border-left-color:#1890ff; font-weight:500; }
  .nav-link .badge { background:#f5222d; color:#fff; padding:1px 6px; border-radius:10px; font-size:10px; margin-left:auto; }
  .nav-link .badge.warn { background:#fa8c16; }

  .main { flex:1; }
  .topbar { background:#fff; padding:0 20px; height:48px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #f0f0f0; font-size:13px; position:sticky; top:44px; z-index:50; }
  .topbar .title { font-weight:500; }
  .content { padding:20px; }
  .view { display:none; }
  .view.active { display:block; }

  /* ===== 通用组件 ===== */
  .stat-cards { display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
  .stat-card { flex:1; min-width:130px; background:#fff; border-radius:8px; padding:18px; cursor:pointer; transition:all .2s; border:1px solid transparent; }
  .stat-card:hover { border-color:#1890ff; box-shadow:0 2px 8px rgba(24,144,255,0.1); }
  .stat-card .l { font-size:12px; color:#999; margin-bottom:8px; }
  .stat-card .v { font-size:28px; font-weight:600; color:#262626; }
  .stat-card .s { font-size:11px; margin-top:4px; }
  .panel { background:#fff; border-radius:8px; margin-bottom:16px; box-shadow:0 1px 4px rgba(0,0,0,.04); }
  .panel-hd { padding:14px 18px; border-bottom:1px solid #f0f0f0; display:flex; align-items:center; justify-content:space-between; font-size:14px; font-weight:500; }
  .panel-bd { padding:16px 18px; }
  .panel-bd.nopad { padding:0; }

  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { background:#fafafa; padding:9px 10px; text-align:left; font-weight:500; color:#888; border-bottom:1px solid #f0f0f0; font-size:12px; white-space:nowrap; }
  td { padding:9px 10px; border-bottom:1px solid #f5f5f5; }
  tr.clickable { cursor:pointer; }
  tr.clickable:hover { background:#e6f7ff; }

  .tag { display:inline-block; padding:2px 8px; border-radius:3px; font-size:11px; }
  .tag-o { background:#fff7e6; color:#fa8c16; }
  .tag-b { background:#e6f7ff; color:#1890ff; }
  .tag-g { background:#f6ffed; color:#52c41a; }
  .tag-r { background:#fff1f0; color:#f5222d; }
  .tag-p { background:#f9f0ff; color:#722ed1; }
  .tag-gray { background:#f5f5f5; color:#999; }

  .btn { display:inline-block; padding:7px 14px; border-radius:4px; border:1px solid #d9d9d9; background:#fff; color:#333; cursor:pointer; font-size:12px; transition:all .2s; text-decoration:none; }
  .btn:hover { border-color:#1890ff; color:#1890ff; }
  .btn-p { background:#1890ff; color:#fff; border-color:#1890ff; }
  .btn-p:hover { background:#40a9ff; color:#fff; }
  .btn-s { background:#52c41a; color:#fff; border-color:#52c41a; }
  .btn-s:hover { background:#73d13d; color:#fff; }
  .btn-d { color:#f5222d; border-color:#f5222d; }
  .btn-d:hover { background:#fff1f0; }
  .btn-w { color:#fa8c16; border-color:#fa8c16; }
  .btn-sm { padding:4px 10px; font-size:11px; }
  .btn-xs { padding:3px 8px; font-size:11px; }
  .btn-group { display:flex; gap:6px; }

  .form-group { margin-bottom:14px; }
  .form-label { display:block; font-size:12px; color:#333; margin-bottom:4px; font-weight:500; }
  .form-label .req { color:#f5222d; }
  .form-input { width:100%; padding:7px 10px; border:1px solid #d9d9d9; border-radius:4px; font-size:13px; transition:all .2s; background:#fff; }
  .form-input:focus { outline:none; border-color:#1890ff; box-shadow:0 0 0 2px rgba(24,144,255,0.15); }
  select.form-input { cursor:pointer; }
  textarea.form-input { resize:vertical; min-height:70px; font-family:inherit; }
  .form-row { display:flex; gap:14px; }
  .form-row > * { flex:1; }

  .opt-group { display:flex; gap:6px; flex-wrap:wrap; }
  .opt-item { padding:6px 14px; border:1px solid #d9d9d9; border-radius:4px; cursor:pointer; font-size:12px; transition:all .2s; background:#fff; }
  .opt-item:hover { border-color:#1890ff; }
  .opt-item.sel { background:#e6f7ff; color:#1890ff; border-color:#1890ff; }

  .tabs { display:flex; gap:0; margin-bottom:14px; border-bottom:2px solid #f0f0f0; flex-wrap:wrap; }
  .tab { padding:8px 14px; cursor:pointer; font-size:12px; color:#888; border-bottom:2px solid transparent; margin-bottom:-2px; transition:all .15s; }
  .tab:hover { color:#1890ff; }
  .tab.active { color:#1890ff; border-bottom-color:#1890ff; font-weight:500; }
  .tab .cnt { font-size:11px; }

  .toast { position:fixed; top:60px; right:20px; padding:10px 18px; border-radius:4px; font-size:13px; z-index:999; display:none; animation:fadeIn .3s; color:#fff; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(-8px);} to{opacity:1;transform:translateY(0);} }
  .steps { display:flex; align-items:center; margin-bottom:20px; overflow-x:auto; gap:0; }
  .step { display:flex; align-items:center; font-size:11px; white-space:nowrap; }
  .step .c { width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;margin-right:4px; }
  .step .c.done { background:#52c41a; color:#fff; }
  .step .c.cur { background:#1890ff; color:#fff; }
  .step .c.wait { background:#f0f0f0; color:#bbb; }
  .step .l { width:36px;height:1px;background:#e8e8e8;margin:0 8px; }
  .step .l.done { background:#52c41a; }

  .upload-zone { border:2px dashed #d9d9d9; border-radius:8px; padding:32px; text-align:center; cursor:pointer; transition:all .2s; background:#fafafa; }
  .upload-zone:hover { border-color:#1890ff; background:#e6f7ff; }
  .upload-zone .ic { font-size:32px; margin-bottom:6px; }

  .tip { background:#fffbe6; border:1px solid #ffe58f; border-radius:8px; padding:12px 16px; font-size:12px; color:#666; margin-top:12px; }
  .tip strong { color:#fa8c16; }
  hr { margin:14px 0; border:none; border-top:1px solid #f0f0f0; }
  .link { color:#1890ff; cursor:pointer; }
  .link:hover { color:#40a9ff; text-decoration:underline; }
</style>
</head>
<body>

<!-- ===== 角色切换栏 ===== -->
<div class="role-bar">
  <div class="brand"><span class="dot"></span>代练管理平台</div>
  <div style="display:flex;align-items:center;gap:16px;">
    <div class="role-switcher">
      <button class="role-btn ops active" data-role="ops">👩‍💼 运营</button>
      <button class="role-btn cs" data-role="cs">🎧 客服</button>
      <button class="role-btn booster" data-role="booster">🎮 代练员</button>
    </div>
    <span class="current-role ops" id="role-tag">运营：小周</span>
  </div>
</div>

<!-- ===== 主体布局 ===== -->
<div class="layout">

  <!-- 侧边栏 -->
  <aside class="sidebar" id="sidebar">
    <!-- JS动态渲染 -->
  </aside>

  <!-- 主内容 -->
  <div class="main">
    <div class="topbar"><span class="title" id="page-title">📊 运营工作台</span><span style="color:#999;font-size:12px;">2026-05-19 周二 14:30</span></div>
    <div class="content" id="content-area">
      <!-- JS动态渲染 -->
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== 状态 =====
var currentRole = 'ops';
var currentPage = 'dashboard';
var detailOrderId = '#DF20260519001';
var orderData = {};

// ===== 角色配置 =====
var roleConfig = {
  ops: {
    name: '运营：小周',
    color: '#1890ff',
    cssClass: 'ops',
    icon: '👩‍💼',
    avatar: '周',
    nav: [
      { section:'工作台', items:[
        {id:'dashboard', icon:'📊', label:'数据概览'},
        {id:'order-list', icon:'📋', label:'订单列表', badge:'36'},
      ]},
      { section:'操作', items:[
        {id:'order-entry', icon:'➕', label:'录入订单'},
        {id:'booster-mgmt', icon:'👥', label:'代练员管理'},
      ]},
      { section:'其他', items:[
        {id:'game-config', icon:'🎮', label:'游戏配置'},
        {id:'data-reports', icon:'📈', label:'数据报表'},
      ]}
    ]
  },
  cs: {
    name: '客服：小李',
    color: '#fa8c16',
    cssClass: 'cs',
    icon: '🎧',
    avatar: '李',
    nav: [
      { section:'工作台', items:[
        {id:'cs-dashboard', icon:'📊', label:'工作台概览'},
      ]},
      { section:'审核', items:[
        {id:'review-queue', icon:'🔍', label:'待审核队列', badge:'5', badgeWarn:true},
        {id:'verify-queue', icon:'✅', label:'待验收队列', badge:'6', badgeWarn:true},
      ]},
      { section:'管理', items:[
        {id:'cs-orders', icon:'📋', label:'全部订单'},
        {id:'settlement', icon:'💰', label:'结算管理', badge:'3'},
        {id:'cs-logs', icon:'📝', label:'操作日志'},
      ]}
    ]
  },
  booster: {
    name: '代练员：王代练',
    color: '#52c41a',
    cssClass: 'booster',
    icon: '🎮',
    avatar: '王',
    nav: [
      { section:'工作台', items:[
        {id:'booster-dashboard', icon:'📊', label:'我的工作台'},
        {id:'order-pool', icon:'📋', label:'接单大厅', badge:'8'},
      ]},
      { section:'订单', items:[
        {id:'my-orders', icon:'📝', label:'我的订单', badge:'3'},
      ]},
      { section:'财务', items:[
        {id:'my-earnings', icon:'💰', label:'我的收益'},
        {id:'withdraw', icon:'💳', label:'提现'},
      ]}
    ]
  }
};

// ===== 渲染侧边栏 =====
function renderSidebar() {
  var cfg = roleConfig[currentRole];
  var html = '<div class="user-info"><div class="avatar" style="background:'+cfg.color+'">'+cfg.avatar+'</div><div><div class="name">'+cfg.name+'</div><div class="role-tag">'+cfg.icon+' '+['ops','cs','booster'].indexOf(currentRole)===0?'运营':['ops','cs','booster'].indexOf(currentRole)===1?'客服':'代练员'+'</div></div></div>';
  cfg.nav.forEach(function(section) {
    html += '<div class="nav-section"><div class="nav-label">'+section.section+'</div>';
    section.items.forEach(function(item) {
      var badgeHtml = '';
      if (item.badge) {
        var bc = item.badgeWarn ? 'warn' : '';
        badgeHtml = ' <span class="badge '+bc+'">'+item.badge+'</span>';
      }
      var activeClass = currentPage === item.id ? ' active' : '';
      html += '<a class="nav-link'+activeClass+'" data-page="'+item.id+'">'+item.icon+' '+item.label+badgeHtml+'</a>';
    });
    html += '</div>';
  });
  document.getElementById('sidebar').innerHTML = html;

  // 绑定点击
  document.querySelectorAll('.nav-link').forEach(function(link) {
    link.addEventListener('click', function(e) {
      e.preventDefault();
      var page = this.getAttribute('data-page');
      navigate(page);
    });
  });
}

// ===== 导航 =====
function navigate(page, param) {
  currentPage = page;
  if (param) detailOrderId = param;
  renderSidebar();
  renderContent();
}

// ===== 页面标题 =====
function getPageTitle() {
  var allNavs = roleConfig[currentRole].nav;
  for (var i=0; i<allNavs.length; i++) {
    for (var j=0; j<allNavs[i].items.length; j++) {
      if (allNavs[i].items[j].id === currentPage) {
        return allNavs[i].items[j].icon + ' ' + allNavs[i].items[j].label;
      }
    }
  }
  return currentPage;
}

// ===== 渲染内容 =====
function renderContent() {
  document.getElementById('page-title').textContent = getPageTitle();
  var container = document.getElementById('content-area');
  container.innerHTML = '';

  // 用div包裹，通过设置view方式渲染
  var viewDiv = document.createElement('div');
  viewDiv.className = 'view active';

  switch(currentPage) {
    // ==================== 运营 ====================
    case 'dashboard': viewDiv.innerHTML = renderOpsDashboard(); break;
    case 'order-list': viewDiv.innerHTML = renderOrderList('ops'); break;
    case 'order-entry': viewDiv.innerHTML = renderOrderEntry(); break;
    case 'booster-mgmt': viewDiv.innerHTML = renderBoosterMgmt(); break;
    case 'game-config': viewDiv.innerHTML = placeholder('🎮 游戏配置', '配置游戏信息、服务类型、扣子类型、结算规则'); break;
    case 'data-reports': viewDiv.innerHTML = placeholder('📈 数据报表', '订单量趋势、流水统计、代练员绩效'); break;

    // ==================== 客服 ====================
    case 'cs-dashboard': viewDiv.innerHTML = renderCSDashboard(); break;
    case 'review-queue': viewDiv.innerHTML = renderReviewQueue(); break;
    case 'verify-queue': viewDiv.innerHTML = renderVerifyQueue(); break;
    case 'cs-orders': viewDiv.innerHTML = renderOrderList('cs'); break;
    case 'settlement': viewDiv.innerHTML = renderSettlement(); break;
    case 'cs-logs': viewDiv.innerHTML = placeholder('📝 操作日志', '全量订单操作审计日志，支持按订单号、操作人筛选'); break;

    // ==================== 代练员 ====================
    case 'booster-dashboard': viewDiv.innerHTML = renderBoosterDashboard(); break;
    case 'order-pool': viewDiv.innerHTML = renderOrderPool(); break;
    case 'my-orders': viewDiv.innerHTML = renderMyOrders(); break;
    case 'my-earnings': viewDiv.innerHTML = renderMyEarnings(); break;
    case 'withdraw': viewDiv.innerHTML = renderWithdraw(); break;

    default: viewDiv.innerHTML = placeholder('建设中', '该页面功能开发中');
  }

  container.appendChild(viewDiv);
  bindInteractions();
}

// ==================== 占位 ====================
function placeholder(title, desc) {
  return '<div class="panel"><div class="panel-bd" style="text-align:center;padding:80px 20px;color:#999;"><div style="font-size:48px;margin-bottom:16px;">🚧</div><div style="font-size:16px;margin-bottom:8px;">'+title+'</div><div>'+desc+'</div></div></div>';
}

// ==================== 运营仪表盘 ====================
function renderOpsDashboard() {
  return `
    <div class="stat-cards">
      <div class="stat-card" onclick="navigate('order-list')"><div class="l">今日新增订单</div><div class="v">12</div><div class="s" style="color:#52c41a;">↑ 20% 较昨日</div></div>
      <div class="stat-card" onclick="navigate('order-list')"><div class="l">执行中订单</div><div class="v" style="color:#fa8c16;">28</div><div class="s" style="color:#999;">待验收 6 单</div></div>
      <div class="stat-card"><div class="l">今日流水</div><div class="v" style="color:#52c41a;">¥8,920</div><div class="s" style="color:#999;">待结算 ¥3,200</div></div>
      <div class="stat-card" onclick="navigate('booster-mgmt')"><div class="l">在册代练员</div><div class="v" style="color:#1890ff;">15</div><div class="s" style="color:#52c41a;">在线 8 人</div></div>
    </div>
    <div class="stat-cards">
      <div class="stat-card" onclick="navigate('order-entry')" style="display:flex;align-items:center;gap:12px;">
        <div style="width:40px;height:40px;background:#e6f7ff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;">➕</div>
        <div><div style="font-size:14px;font-weight:500;">录入订单</div><div style="font-size:11px;color:#999;">新增一条订单记录</div></div>
      </div>
      <div class="stat-card" style="display:flex;align-items:center;gap:12px;" onclick="switchRole('cs')">
        <div style="width:40px;height:40px;background:#fff7e6;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;">🔍</div>
        <div><div style="font-size:14px;font-weight:500;">待审核 5 单</div><div style="font-size:11px;color:#999;">切换客服角色处理</div></div>
      </div>
      <div class="stat-card" style="display:flex;align-items:center;gap:12px;" onclick="navigate('data-reports')">
        <div style="width:40px;height:40px;background:#f6ffed;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;">📈</div>
        <div><div style="font-size:14px;font-weight:500;">数据报表</div><div style="font-size:11px;color:#999;">查看业务趋势</div></div>
      </div>
    </div>
    <div class="panel"><div class="panel-hd">最近订单<a class="link" onclick="navigate('order-list')">查看全部 →</a></div>
      <div class="panel-bd nopad">
        <table><thead><tr><th>订单号</th><th>服务</th><th>来源</th><th>客户</th><th>金额</th><th>状态</th><th>时间</th></tr></thead><tbody>
          <tr class="clickable" onclick="switchRole('cs');navigate('review-queue')"><td class="link">#DF20260519001</td><td>排位上分</td><td><span class="tag tag-o">私域</span></td><td>张先生</td><td>¥298</td><td><span class="tag tag-gray">待审核</span></td><td>10:32</td></tr>
          <tr class="clickable" onclick="switchRole('booster');navigate('order-pool')"><td class="link">#DF20260519002</td><td>任务代打</td><td><span class="tag tag-b">咸鱼</span></td><td>李四</td><td>¥150</td><td><span class="tag tag-b">执行中</span></td><td>昨天</td></tr>
          <tr class="clickable" onclick="switchRole('cs');navigate('verify-queue')"><td class="link">#DF20260519003</td><td>装备刷取</td><td><span class="tag tag-g">三方</span></td><td>赵六</td><td>¥520</td><td><span class="tag tag-o">待验收</span></td><td>05-17</td></tr>
        </tbody></table>
      </div>
    </div>
  `;
}

// ==================== 订单列表(运营/客服共用) ====================
function renderOrderList(role) {
  return `
    <div style="display:flex;justify-content:space-between;margin-bottom:14px;">
      <div class="btn-group">
        ${role==='ops'?'<button class="btn btn-p" onclick="navigate(\'order-entry\')">+ 录入订单</button>':''}
        <button class="btn">导出</button>
      </div>
      <div style="display:flex;gap:6px;"><input class="form-input" style="width:200px;" placeholder="搜索订单号/客户..."><button class="btn btn-p">搜索</button></div>
    </div>
    <div class="tabs">
      <a class="tab active">全部<span class="cnt">36</span></a>
      <a class="tab">待审核<span class="cnt">5</span></a>
      <a class="tab">待接单<span class="cnt">8</span></a>
      <a class="tab">执行中<span class="cnt">12</span></a>
      <a class="tab">待验收<span class="cnt">6</span></a>
      <a class="tab">待结算<span class="cnt">3</span></a>
      <a class="tab">已完成<span class="cnt">2</span></a>

// ==================== 绑定交互 ====================
function bindInteractions() {
  // Tab切换
  document.querySelectorAll('.tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      var parent = this.parentElement;
      if (!parent) return;
      parent.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      this.classList.add('active');
    });
  });

  // 选项组
  document.querySelectorAll('.opt-group').forEach(function(group) {
    group.querySelectorAll('.opt-item').forEach(function(item) {
      item.addEventListener('click', function() {
        group.querySelectorAll('.opt-item').forEach(function(i) { i.classList.remove('sel'); });
        this.classList.add('sel');

        // 录入页：订单类型联动
        if (group.id === 'entry-type') {
          var ag = document.getElementById('entry-assign');
          if (ag) ag.style.display = this.getAttribute('data-val') === '派单' ? '' : 'none';
        }

        // 录入页：来源联动付款方式
        if (group.id === 'entry-source') {
          var ps = document.getElementById('entry-pay');
          if (ps) ps.value = this.getAttribute('data-val') === '私域' ? '预付（客户已付）' : '后付（完成后收款）';
        }

        // 提现页：收款方式联动
        if (group.id === 'withdraw-method') {
          ['wechat','alipay','bank'].forEach(function(k) {
            var el = document.getElementById('wd-'+k);
            if (el) el.style.display = 'none';
          });
          var target = document.getElementById('wd-'+this.getAttribute('data-val'));
          if (target) target.style.display = '';
        }
      });
    });
  });
}

// ===== Toast =====
function showToast(msg, color) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = color || '#52c41a';
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 2000);
}

// ===== 接单 =====
function claimOrder(id) {
  showToast('✓ 已接单 ' + id + '，订单已加入「我的订单」', '#52c41a');
}

// ===== 验收 =====
function verifyOrder(id, action) {
  if (action === 'pass') {
    showToast('✓ ' + id + ' 验收通过，已进入待结算', '#52c41a');
  } else {
    showToast('↩ ' + id + ' 已退回代练员修改', '#f5222d');
  }
}

// ===== 角色切换 =====
function switchRole(role) {
  currentRole = role;
  document.querySelectorAll('.role-btn').forEach(function(b) { b.classList.remove('active'); });
  document.querySelector('.role-btn.' + roleConfig[role].cssClass).classList.add('active');
  var tag = document.getElementById('role-tag');
  tag.textContent = roleConfig[role].name;
  tag.className = 'current-role ' + roleConfig[role].cssClass;

  // 切到该角色首页
  currentPage = role === 'ops' ? 'dashboard' : role === 'cs' ? 'cs-dashboard' : 'booster-dashboard';
  renderSidebar();
  renderContent();
}

// ===== 初始化 =====
document.querySelectorAll('.role-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    var role = this.getAttribute('data-role');
    switchRole(role);
  });
});

renderContent();
